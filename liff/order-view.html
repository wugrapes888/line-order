<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>查看訂單</title>
  <link rel="stylesheet" href="css/liff.css" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

<div id="screen-loading" class="screen active">
  <div class="spinner"></div>
  <p>載入訂單中...</p>
</div>

<div id="screen-error" class="screen">
  <div class="error-icon">✕</div>
  <h2 id="error-title">無法查看此訂單</h2>
  <p id="error-message"></p>
</div>

<div id="screen-order" class="screen">
  <header class="order-header">
    <h1>訂單明細</h1>
  </header>
  <div id="order-detail" class="order-card"></div>
</div>

<script src="js/config.js"></script>
<script src="js/liff-init.js"></script>
<script src="js/order-view.js"></script>
</body>
</html>
