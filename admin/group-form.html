<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>開新團</title>
  <link rel="stylesheet" href="css/admin.css" />
  <style>
    .spec-block { background: #f5f5f5; border-radius: 8px; padding: 10px; margin-top: 8px; }
    .spec-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .spec-header span { font-size: 13px; font-weight: 600; color: #555; }
    .choices-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    .choice-tag { background: #fff; border: 1px solid #ccc; border-radius: 20px; padding: 2px 10px; font-size: 13px; display: flex; align-items: center; gap: 4px; }
    .choice-tag button { background: none; border: none; cursor: pointer; color: #999; font-size: 14px; line-height: 1; }
    .spec-add-row { display: flex; gap: 6px; margin-top: 6px; }
    .spec-add-row input { flex: 1; padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .spec-add-row button { padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-size: 14px; }
    .spec-options-row { display: flex; gap: 12px; font-size: 13px; color: #555; margin-top: 4px; }
    .spec-options-row label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  </style>
</head>
<body>
<header class="admin-header">
  <button onclick="history.back()">← 返回</button>
  <h1>開新團</h1>
</header>

<form id="group-form" class="form-section">
  <div class="form-group">
    <label>團名 <span class="required">*</span></label>
    <input type="text" id="group-name" placeholder="例：GA BUTTER 奶酥" required />
  </div>
  <div class="form-group">
    <label>截團時間 <span class="required">*</span></label>
    <input type="datetime-local" id="deadline-at" required />
  </div>
  <div class="form-group">
    <label>備註</label>
    <input type="text" id="group-note" placeholder="選填" />
  </div>

  <h3>商品設定</h3>
  <div id="products-container"></div>
  <button type="button" class="btn-outline" onclick="addProduct()">+ 新增商品</button>

  <br /><br />
  <button type="button" class="btn-primary" onclick="submitGroup()">建立團購</button>
  <p id="form-error" class="error-msg"></p>
  <div id="form-success" class="success-msg" style="display:none;padding:12px;background:#d4f0e5;border-radius:8px;margin-top:12px;"></div>
</form>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  var productCount = 0;

  document.addEventListener('DOMContentLoaded', function () {
    if (!isLoggedIn()) { window.location.href = 'index.html'; return; }
    addProduct();
  });

  // ===== 商品管理 =====

  function addProduct() {
    productCount++;
    var idx = productCount;
    var div = document.createElement('div');
    div.className = 'product-form-card';
    div.id = 'product-' + idx;
    div.innerHTML =
      '<div class="product-form-header">商品 ' + idx +
        ' <button type="button" onclick="removeProduct(' + idx + ')">移除</button>' +
      '</div>' +
      '<div class="form-group"><label>商品名稱 *</label>' +
        '<input type="text" id="p-name-' + idx + '" placeholder="商品名稱" /></div>' +
      '<div class="form-group"><label>單價 *</label>' +
        '<input type="number" id="p-price-' + idx + '" placeholder="0" /></div>' +
      '<div class="form-group"><label>說明</label>' +
        '<input type="text" id="p-desc-' + idx + '" placeholder="商品描述（選填）" /></div>' +
      '<div class="form-group"><label>商品圖片網址</label>' +
        '<input type="url" id="p-image-' + idx + '" placeholder="https://... （選填）" ' +
               'oninput="previewProductImage(this)" />' +
        '<div id="p-preview-' + idx + '" style="margin-top:6px;display:none;">' +
          '<img src="" style="width:100%;max-height:160px;object-fit:cover;border-radius:8px;border:1px solid #ddd;" ' +
               'onerror="this.parentElement.style.display=\'none\'" />' +
        '</div>' +
      '</div>' +
      '<div class="form-group"><label>標籤</label>' +
        '<input type="text" id="p-badge-' + idx + '" placeholder="例：NEW（選填）" /></div>' +
      '<div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
          '<span style="font-size:14px;font-weight:600;">規格選項</span>' +
          '<button type="button" class="btn-sm" onclick="addSpec(' + idx + ')">+ 新增規格</button>' +
        '</div>' +
        '<div id="specs-' + idx + '"></div>' +
      '</div>';
    document.getElementById('products-container').appendChild(div);
  }

  function removeProduct(idx) {
    var el = document.getElementById('product-' + idx);
    if (el) el.remove();
  }

  function previewProductImage(input) {
    var v = input.value.trim();
    var preview = input.parentElement.querySelector('div');
    if (v) {
      preview.style.display = '';
      preview.querySelector('img').src = v;
    } else {
      preview.style.display = 'none';
    }
  }

  // ===== 規格編輯器 =====

  var specCounts = {};

  function addSpec(productIdx) {
    specCounts[productIdx] = (specCounts[productIdx] || 0) + 1;
    var sIdx = specCounts[productIdx];
    var container = document.getElementById('specs-' + productIdx);
    var block = document.createElement('div');
    block.className = 'spec-block';
    block.id = 'spec-' + productIdx + '-' + sIdx;
    block.innerHTML =
      '<div class="spec-header">' +
        '<input type="text" placeholder="規格名稱（例：口味）" id="spec-name-' + productIdx + '-' + sIdx + '" ' +
               'style="flex:1;padding:4px 8px;border:1px solid #ddd;border-radius:6px;font-size:14px;" />' +
        '<button type="button" onclick="removeSpec(\'' + productIdx + '\', \'' + sIdx + '\')" ' +
                'style="margin-left:8px;background:none;border:none;cursor:pointer;color:#999;font-size:18px;">×</button>' +
      '</div>' +
      '<div class="spec-options-row">' +
        '<label><input type="checkbox" id="spec-req-' + productIdx + '-' + sIdx + '" /> 必填</label>' +
        '<label><input type="checkbox" id="spec-mul-' + productIdx + '-' + sIdx + '" /> 可複選</label>' +
      '</div>' +
      '<div class="choices-list" id="choices-' + productIdx + '-' + sIdx + '"></div>' +
      '<div class="spec-add-row">' +
        '<input type="text" id="choice-input-' + productIdx + '-' + sIdx + '" placeholder="新增選項" ' +
               'onkeydown="if(event.key===\'Enter\'){event.preventDefault();addChoice(' + productIdx + ',' + sIdx + ')}" />' +
        '<button type="button" onclick="addChoice(' + productIdx + ', ' + sIdx + ')">新增</button>' +
      '</div>';
    container.appendChild(block);
  }

  function removeSpec(productIdx, sIdx) {
    var el = document.getElementById('spec-' + productIdx + '-' + sIdx);
    if (el) el.remove();
  }

  function addChoice(productIdx, sIdx) {
    var input = document.getElementById('choice-input-' + productIdx + '-' + sIdx);
    var val = input.value.trim();
    if (!val) return;
    var list = document.getElementById('choices-' + productIdx + '-' + sIdx);
    var tag = document.createElement('span');
    tag.className = 'choice-tag';
    tag.dataset.value = val;
    tag.innerHTML = val + '<button type="button" onclick="this.parentElement.remove()">×</button>';
    list.appendChild(tag);
    input.value = '';
    input.focus();
  }

  function collectSpecs(productIdx) {
    var container = document.getElementById('specs-' + productIdx);
    if (!container) return { options: [] };
    var blocks = container.querySelectorAll('.spec-block');
    var options = [];
    blocks.forEach(function (block) {
      var parts = block.id.split('-'); // spec-pIdx-sIdx
      var pIdx = parts[1]; var sIdx = parts[2];
      var name = document.getElementById('spec-name-' + pIdx + '-' + sIdx).value.trim();
      if (!name) return;
      var required = document.getElementById('spec-req-' + pIdx + '-' + sIdx).checked;
      var multiple = document.getElementById('spec-mul-' + pIdx + '-' + sIdx).checked;
      var choices = Array.from(block.querySelectorAll('.choice-tag')).map(function (t) { return t.dataset.value; });
      if (choices.length === 0) return;
      options.push({ name: name, required: required, multiple: multiple, choices: choices });
    });
    return { options: options };
  }

  // ===== 送出 =====

  function submitGroup() {
    var name     = document.getElementById('group-name').value.trim();
    var deadline = document.getElementById('deadline-at').value;
    var note     = document.getElementById('group-note').value.trim();

    if (!name || !deadline) {
      document.getElementById('form-error').textContent = '請填寫團名與截團時間';
      return;
    }

    var products = [];
    document.querySelectorAll('.product-form-card').forEach(function (card) {
      var id     = card.id.replace('product-', '');
      var pName  = document.getElementById('p-name-' + id).value.trim();
      var pPrice = parseFloat(document.getElementById('p-price-' + id).value);
      var pDesc  = document.getElementById('p-desc-' + id).value.trim();
      var pImage = document.getElementById('p-image-' + id).value.trim();
      var pBadge = document.getElementById('p-badge-' + id).value.trim();
      if (pName && !isNaN(pPrice)) {
        products.push({
          productName: pName,
          price:       pPrice,
          description: pDesc,
          imageUrl:    pImage,
          badge:       pBadge,
          isActive:    true,
          optionsJson: collectSpecs(id)
        });
      }
    });

    document.getElementById('form-error').textContent = '';
    callGAS({
      action:     'createGroup',
      adminToken: getToken(),
      groupName:  name,
      deadlineAt: new Date(deadline).toISOString(),
      note:       note,
      products:   products
    }).then(function (res) {
      if (res.ok) {
        var box = document.getElementById('form-success');
        box.style.display = 'block';
        box.innerHTML =
          '✓ 團購建立成功！<br>' +
          '<strong>分享連結：</strong><br>' +
          '<a href="' + res.shareUrl + '" target="_blank">' + res.shareUrl + '</a><br><br>' +
          '<button class="btn-sm" onclick="navigator.clipboard.writeText(\'' + res.shareUrl + '\').then(function(){alert(\'已複製！\')})">複製連結</button>' +
          '　<button class="btn-sm" onclick="window.location.href=\'products.html?groupId=' + res.groupId + '\'">管理商品</button>' +
          '　<button class="btn-sm" onclick="history.back()">返回列表</button>';
      } else {
        document.getElementById('form-error').textContent = res.error;
      }
    });
  }
</script>
</body>
</html>
